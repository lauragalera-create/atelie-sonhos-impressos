<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê Sonhos Impressos</title>
</head>
<body>
    <header>
        <h1>Encomendas</h1>
        <main>
            <nav>
                <a href="index.html">Início</a><br>
                <a href="catalogo.html">Catálogo</a><br>
                <a href="encomendas.html">Encomende seus sonhos <3</a><br>
                <a href="contato.html">Informações para contato</a>
            </nav>
        </main>
    </header>

        <h2>Encomende o seu pedido <3</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome"><br>
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email"><br>
            <label for="telefone">Telefone:</label>
            <input 
                name="telefone"
                id="telefone"
                required
                inputmode="numeric"
                maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com DDD. Exemplo: (17)98765-4321 ou 17987654321"
            ><br>
            <label for="data">Data do evento/Entrega:</label>
            <input type="date" name="data" id="data"><br>
            <label for="hora">Horário de entrega:</label>
            <input type="time" name="hora" id="hora"><br>
            <label for="opcoes">Opções:</label>
            <select name="especialidade" id="especialidade">
                <option value="">Selecione uma opção</option>
                <option value="papelaria-de-festa">Papelaria de Festa</option>
                <option value="encadernacao-afetiva">Encadernação Afetiva</option>
                <option value="kits-corporativos">Kits Corporativos</option>
                <option value="lebrancinhas">Lembrancinhas</option>
                <option value="outras">Outras opções</option>
            </select>
            <br>
            <label for="mensagem">Especifique seu pedido:</label>
            <textarea name="mensagem" id="mensagem"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>
        </form>
    </main>
<hr>
    <footer>
        <p>
            &copy;Ateliê Sonhos Impressos - Todos os Direitos Reservados
        </p>
    </footer>
</body>
</html>
